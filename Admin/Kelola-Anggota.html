<html lang="id">
<head>
    <script>
        if (sessionStorage.getItem('adminSession') !== 'active') {
            window.location.replace('Login-Admin.html');
        }
        if (localStorage.getItem('theme') !== 'dark') {
            document.documentElement.classList.add('light-mode');
        }
    </script>
    <link class="head-theme-sync" rel="icon" href="../bendahara.png" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Anggota Center</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        @custom-variant dark (&:where(.dark, .dark *));

        :root {
            /* ==========================================================================
               DARK MODE (DEFAULT) SYSTEM - Modern Deep Space & Treasury Emerald / Cyber Cyan
               ========================================================================== */
            --bg-main: #080C14;              /* Deep Space Cosmic Black */
            --bg-card: #0F1623;              /* Crisp card background with high contrast */
            --border-card: #1E293B;          /* Sophisticated border */
            --border-muted: #151F30;         /* Subtler border */
            
            --text-primary: #F8FAFC;         /* Slate 50 */
            --text-sec-100: #F1F5F9;         /* Slate 100 */
            --text-sec-200: #E2E8F0;         /* Slate 200 */
            --text-sec-300: #CBD5E1;         /* Slate 300 */
            --text-sec-400: #94A3B8;         /* Slate 400 */
            --text-sec-500: #64748B;         /* Slate 500 */
            --text-sec-600: #475569;         /* Slate 600 */
            
            --bg-neutral-pill: #162032;      /* Background for neutral pills */
            
            --bg-cyan-pill: rgba(6, 182, 212, 0.12);
            --border-cyan-pill: rgba(6, 182, 212, 0.28);
            --text-cyan-accent: #22D3EE;     /* Cyan 400 */
            
            --bg-green-pill: rgba(16, 185, 129, 0.12);
            --border-green-pill: rgba(16, 185, 129, 0.28);
            --text-green-accent: #10B981;    /* Emerald 500 */
            
            --bg-amber-pill: rgba(245, 158, 11, 0.12);
            --border-amber-pill: rgba(245, 158, 11, 0.28);
            --text-amber-accent: #FBBF24;    /* Amber 400 */
            
            --text-rose-accent: #FB7185;     /* Rose 400 */
            
            --splash-bg: #080C14;
            --splash-text: #FFFFFF;
            --splash-glow: rgba(16, 185, 129, 0.12);
            
            --footer-bg: rgba(15, 22, 35, 0.6);
            --footer-border: #1E293B;
            
            --hover-cyan-border: rgba(6, 182, 212, 0.5);
            --hover-green-border: rgba(16, 185, 129, 0.5);
            --hover-amber-border: rgba(245, 158, 11, 0.5);
            --hover-neutral-border: #334155;

            /* Accent glow variables */
            --glow-cyan: 0 4px 20px rgba(6, 182, 212, 0.20);
            --glow-green: 0 4px 20px rgba(16, 185, 129, 0.20);
            --shadow-card: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }
        
        html.light-mode {
            /* ==========================================================================
               LIGHT MODE SYSTEM - Warm Cream (#FAF5EF) & Executive Treasury Palette
               ========================================================================== */
            --bg-main: #FAF5EF;              /* Warm soothing cream */
            --bg-card: #FFFFFF;              /* Crisp white cards */
            --border-card: #E5DCD0;          /* Warm sand border */
            --border-muted: #EFE8DE;         /* Soft sand muted border */
            
            --text-primary: #1C1917;         /* Deep stone for high contrast readability */
            --text-sec-100: #292524;
            --text-sec-200: #44403C;
            --text-sec-300: #57534E;
            --text-sec-400: #78716C;
            --text-sec-500: #A8A29E;
            --text-sec-600: #D6D3D1;
            
            --bg-neutral-pill: #F5EFE6;      /* Sand pill */
            
            --bg-cyan-pill: rgba(6, 182, 212, 0.08);
            --border-cyan-pill: rgba(6, 182, 212, 0.25);
            --text-cyan-accent: #0891B2;
            
            --bg-green-pill: rgba(5, 150, 105, 0.08);
            --border-green-pill: rgba(5, 150, 105, 0.25);
            --text-green-accent: #059669;    /* Executive Emerald */
            
            --bg-amber-pill: rgba(217, 119, 6, 0.08);
            --border-amber-pill: rgba(217, 119, 6, 0.25);
            --text-amber-accent: #B45309;
            
            --text-rose-accent: #E11D48;
            
            --splash-bg: #FAF5EF;
            --splash-text: #1C1917;
            --splash-glow: rgba(5, 150, 105, 0.08);
            
            --footer-bg: rgba(255, 255, 255, 0.7);
            --footer-border: #E5DCD0;
            
            --hover-cyan-border: rgba(6, 182, 212, 0.4);
            --hover-green-border: rgba(5, 150, 105, 0.4);
            --hover-amber-border: rgba(217, 119, 6, 0.4);
            --hover-neutral-border: #CBD5E1;

            /* Shadow & glow adjustments */
            --glow-cyan: 0 4px 15px rgba(8, 145, 178, 0.10);
            --glow-green: 0 4px 15px rgba(16, 185, 129, 0.12);
            --shadow-card: 0 10px 30px -10px rgba(16, 185, 129, 0.08);
        }

        /* Font weight overrides in Light Mode to ensure readability */
        html.light-mode, html.light-mode body {
            font-weight: 500 !important;
        }
        html.light-mode .font-light,
        html.light-mode .font-normal {
            font-weight: 500 !important;
        }
        html.light-mode .font-medium {
            font-weight: 600 !important;
        }
        html.light-mode .font-semibold {
            font-weight: 700 !important;
        }
        html.light-mode .font-bold {
            font-weight: 800 !important;
        }
        html.light-mode input::placeholder {
            color: var(--text-sec-500) !important;
            opacity: 1 !important;
        }

        /* High contrast inputs and select fields in Light Mode */
        html.light-mode input, 
        html.light-mode select {
            background-color: var(--bg-main) !important; 
            border: 1px solid var(--border-card) !important; 
            color: var(--text-primary) !important;
        }
        html.light-mode input:focus, 
        html.light-mode select:focus {
            border-color: var(--text-cyan-accent) !important;
            box-shadow: 0 0 0 2px rgba(8, 145, 178, 0.15) !important;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg-main) !important; 
            color: var(--text-primary) !important; 
            transition: background-color 0.4s cubic-bezier(0.4, 0, 0.2, 1), color 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
            min-height: 100vh;
        }
        
        .premium-card {
            background-color: var(--bg-card) !important;
            border-color: var(--border-card) !important;
            box-shadow: var(--shadow-card);
            transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.2s ease;
        }

        /* DYNAMIC COSMIC NEBULA BACKGROUND */
        body::before {
            content: "";
            position: fixed;
            top: -120px;
            left: -120px;
            width: calc(100% + 240px);
            height: calc(100% + 240px);
            background: 
                radial-gradient(ellipse 65% 55% at 15% 15%, rgba(16, 185, 129, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse 55% 50% at 85% 25%, rgba(6, 182, 212, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse 60% 60% at 75% 85%, rgba(99, 102, 241, 0.12) 0%, transparent 60%),
                radial-gradient(ellipse 50% 50% at 25% 80%, rgba(5, 150, 105, 0.10) 0%, transparent 60%),
                radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.25) 0%, transparent 70%);
            filter: blur(55px);
            pointer-events: none;
            z-index: -2;
            animation: pulseGlow 18s ease-in-out infinite alternate;
        }

        html.light-mode body::before {
            background: 
                radial-gradient(circle at 12% 15%, rgba(16, 185, 129, 0.18) 0%, transparent 48%),
                radial-gradient(circle at 88% 85%, rgba(6, 182, 212, 0.15) 0%, transparent 48%),
                radial-gradient(circle at 50% 50%, rgba(254, 215, 170, 0.16) 0%, transparent 52%) !important;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.06) translate(15px, -15px); }
        }

        /* AUTHENTIC OUTER SPACE STARFIELD */
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg%20width%3D%22400%22%20height%3D%22400%22%20viewBox%3D%220%200%20400%20400%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%3E%3Cg%20fill%3D%22%23ffffff%22%3E%3Ccircle%20cx%3D%2220%22%20cy%3D%2235%22%20r%3D%220.7%22%20opacity%3D%220.5%22%2F%3E%3Ccircle%20cx%3D%2295%22%20cy%3D%2218%22%20r%3D%220.6%22%20opacity%3D%220.6%22%2F%3E%3Ccircle%20cx%3D%22160%22%20cy%3D%2290%22%20r%3D%220.8%22%20opacity%3D%220.4%22%2F%3E%3Ccircle%20cx%3D%22230%22%20cy%3D%2230%22%20r%3D%220.7%22%20opacity%3D%220.65%22%2F%3E%3Ccircle%20cx%3D%22310%22%20cy%3D%2265%22%20r%3D%220.6%22%20opacity%3D%220.5%22%2F%3E%3Ccircle%20cx%3D%22375%22%20cy%3D%2222%22%20r%3D%220.75%22%20opacity%3D%220.6%22%2F%3E%3Ccircle%20cx%3D%2248%22%20cy%3D%22130%22%20r%3D%220.65%22%20opacity%3D%220.45%22%2F%3E%3Ccircle%20cx%3D%22120%22%20cy%3D%22175%22%20r%3D%220.8%22%20opacity%3D%220.6%22%2F%3E%3Ccircle%20cx%3D%22190%22%20cy%3D%22140%22%20r%3D%220.6%22%20opacity%3D%220.4%22%2F%3E%3Ccircle%20cx%3D%22265%22%20cy%3D%22160%22%20r%3D%220.75%22%20opacity%3D%220.55%22%2F%3E%3Ccircle%20cx%3D%22340%22%20cy%3D%22120%22%20r%3D%220.7%22%20opacity%3D%220.65%22%2F%3E%3Ccircle%20cx%3D%2235%22%20cy%3D%22235%22%20r%3D%220.6%22%20opacity%3D%220.5%22%2F%3E%3Ccircle%20cx%3D%22105%22%20cy%3D%22260%22%20r%3D%220.75%22%20opacity%3D%220.55%22%2F%3E%3Ccircle%20cx%3D%22170%22%20cy%3D%22220%22%20r%3D%220.8%22%20opacity%3D%220.45%22%2F%3E%3Ccircle%20cx%3D%22245%22%20cy%3D%22250%22%20r%3D%220.65%22%20opacity%3D%220.6%22%2F%3E%3Ccircle%20cx%3D%22305%22%20cy%3D%22215%22%20r%3D%220.7%22%20opacity%3D%220.45%22%2F%3E%3Ccircle%20cx%3D%22370%22%20cy%3D%22255%22%20r%3D%220.8%22%20opacity%3D%220.55%22%2F%3E%3Ccircle%20cx%3D%2265%22%20cy%3D%22330%22%20r%3D%220.7%22%20opacity%3D%220.5%22%2F%3E%3Ccircle%20cx%3D%22140%22%20cy%3D%22350%22%20r%3D%220.6%22%20opacity%3D%220.4%22%2F%3E%3Ccircle%20cx%3D%22210%22%20cy%3D%22315%22%20r%3D%220.8%22%20opacity%3D%220.65%22%2F%3E%3Ccircle%20cx%3D%22285%22%20cy%3D%22345%22%20r%3D%220.7%22%20opacity%3D%220.5%22%2F%3E%3Ccircle%20cx%3D%22355%22%20cy%3D%22355%22%20r%3D%220.65%22%20opacity%3D%220.55%22%2F%3E%3Ccircle%20cx%3D%2275%22%20cy%3D%2278%22%20r%3D%221.2%22%20fill%3D%22%236ee7b7%22%20opacity%3D%220.8%22%2F%3E%3Ccircle%20cx%3D%22260%22%20cy%3D%22100%22%20r%3D%221.3%22%20fill%3D%22%2367e8f9%22%20opacity%3D%220.75%22%2F%3E%3Ccircle%20cx%3D%22185%22%20cy%3D%22275%22%20r%3D%221.1%22%20fill%3D%22%2334d399%22%20opacity%3D%220.7%22%2F%3E%3Ccircle%20cx%3D%22345%22%20cy%3D%22190%22%20r%3D%221.2%22%20fill%3D%22%2338bdf8%22%20opacity%3D%220.8%22%2F%3E%3Ccircle%20cx%3D%2215%22%20cy%3D%22195%22%20r%3D%221.1%22%20fill%3D%22%23ffffff%22%20opacity%3D%220.75%22%2F%3E%3Ccircle%20cx%3D%22230%22%20cy%3D%22370%22%20r%3D%221.2%22%20fill%3D%22%236ee7b7%22%20opacity%3D%220.75%22%2F%3E%3Ccircle%20cx%3D%22145%22%20cy%3D%2240%22%20r%3D%221.3%22%20fill%3D%22%23ffffff%22%20opacity%3D%220.85%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E");
            background-size: 380px 380px;
            pointer-events: none;
            z-index: -1;
            opacity: 0.75;
            transition: opacity 0.3s ease;
        }

        html.light-mode body::after {
            opacity: 0.05;
        }
        
        /* Subtle glow animations */
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        @keyframes float-masjid {
            0%, 100% { transform: translateY(2px); }
            50% { transform: translateY(-2px); }
        }
        @keyframes pulse-sun {
            0%, 100% { transform: translate(-15px, -22px) scale(0.9); opacity: 0.8; }
            50% { transform: translate(-15px, -22px) scale(1.1); opacity: 1; }
        }
        @keyframes drift-cloud-1 {
            0%, 100% { transform: translate(-20px, -12px); }
            50% { transform: translate(-16px, -12px); }
        }
        @keyframes drift-cloud-2 {
            0%, 100% { transform: translate(20px, -14px); }
            50% { transform: translate(24px, -14px); }
        }
        .animate-float-masjid { animation: float-masjid 3s ease-in-out infinite; }
        .animate-pulse-sun { animation: pulse-sun 4s ease-in-out infinite; }
        .animate-drift-cloud-1 { animation: drift-cloud-1 5s ease-in-out infinite; }
        .animate-drift-cloud-2 { animation: drift-cloud-2 6s ease-in-out infinite; }

        #loading-overlay {
            background-color: var(--splash-bg);
            color: var(--splash-text);
        }
        .spinner-ring {
            border-color: rgba(16, 185, 129, 0.1);
            border-top-color: var(--text-green-accent);
        }

        /* SwAlert overrides to match our design system */
        .swal2-popup {
            background: var(--bg-card) !important;
            border: 1px solid var(--border-card) !important;
            border-radius: 1.25rem !important;
            color: var(--text-primary) !important;
            font-family: 'Plus Jakarta Sans', sans-serif !important;
        }
        .swal2-title {
            color: var(--text-sec-100) !important;
            font-size: 1rem !important;
            font-weight: 700 !important;
        }
        .swal2-html-container {
            color: var(--text-sec-400) !important;
            font-size: 0.75rem !important;
        }
        .swal2-confirm {
            background-color: #10b981 !important; /* Emerald 500 */
            color: #07090e !important;
            font-family: monospace !important;
            font-weight: 700 !important;
            font-size: 10px !important;
            border-radius: 0.75rem !important;
            padding: 0.75rem 1.5rem !important;
        }
        .swal2-cancel {
            background-color: #1c2235 !important;
            color: var(--text-sec-300) !important;
            font-family: monospace !important;
            font-weight: 700 !important;
            font-size: 10px !important;
            border-radius: 0.75rem !important;
            padding: 0.75rem 1.5rem !important;
        }

        /* ==========================================================================
           MODERN MOBILE BOTTOM NAVIGATION DOCK (ADMIN FINTECH STYLE 2026)
           ========================================================================== */
        .mobile-bottom-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 64px;
            background: rgba(8, 12, 20, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(16, 185, 129, 0.3);
            box-shadow: 0 -4px 25px rgba(0, 0, 0, 0.5), 0 -1px 3px rgba(16, 185, 129, 0.15);
            z-index: 40;
            padding: 4px 6px calc(env(safe-area-inset-bottom, 0px) + 4px) 6px;
            align-items: center;
            justify-content: space-around;
        }

        html.light-mode .mobile-bottom-nav {
            background: rgba(255, 255, 255, 0.96) !important;
            border-top: 1.5px solid rgba(16, 185, 129, 0.3) !important;
            box-shadow: 0 -4px 20px rgba(16, 185, 129, 0.12), 0 -1px 4px rgba(0, 0, 0, 0.04) !important;
        }

        .bottom-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            min-width: 0;
            padding: 4px 2px;
            color: #94a3b8;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            border: none;
            background: transparent;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .bottom-nav-item:active {
            transform: scale(0.92);
        }

        .bottom-nav-item .nav-icon-wrap {
            width: 34px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.25s ease;
            position: relative;
        }

        .bottom-nav-item .nav-label {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: -0.01em;
            line-height: 1.2;
            margin-top: 2px;
            transition: color 0.2s ease, font-weight 0.2s ease;
            white-space: nowrap;
        }

        /* Dark Mode Active State - Emerald Glow */
        .bottom-nav-item.active {
            color: #34d399;
        }
        .bottom-nav-item.active .nav-icon-wrap {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            box-shadow: 0 0 14px rgba(16, 185, 129, 0.4);
            border: 1px solid rgba(16, 185, 129, 0.35);
        }
        .bottom-nav-item.active .nav-label {
            color: #34d399;
            font-weight: 800;
        }

        /* Light Mode Active State */
        html.light-mode .bottom-nav-item {
            color: #64748b;
        }
        html.light-mode .bottom-nav-item.active {
            color: #059669 !important;
        }
        html.light-mode .bottom-nav-item.active .nav-icon-wrap {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%) !important;
            color: #ffffff !important;
            box-shadow: 0 3px 10px rgba(16, 185, 129, 0.38) !important;
        }
        html.light-mode .bottom-nav-item.active .nav-label {
            color: #059669 !important;
            font-weight: 800 !important;
        }

        @media (max-width: 768px) {
            .mobile-bottom-nav {
                display: flex !important;
            }
            body {
                padding-bottom: 84px !important;
            }
        }
    </style>
</head>
<body class="min-h-screen antialiased flex flex-col justify-between selection:bg-emerald-950 selection:text-emerald-400 relative">

    <!-- PREMIUM LOADING OVERLAY -->
    <div id="loading-overlay" class="fixed inset-0 z-[9999] flex flex-col items-center justify-center transition-all duration-300">
        <div class="relative flex flex-col items-center justify-center">
            <!-- Spinner Ring Outer -->
            <div class="w-20 h-20 rounded-full border-4 spinner-ring animate-spin"></div>
            
            <!-- Floating Elements Inside -->
            <div class="absolute w-20 h-20 flex items-center justify-center overflow-hidden">
                <div class="absolute text-amber-400 text-xs animate-pulse-sun" style="transform: translate(-15px, -22px);">☀️</div>
                <div class="absolute text-neutral-400 text-[9px] animate-drift-cloud-1" style="transform: translate(-20px, -12px);">☁️</div>
                <div class="absolute text-neutral-500 text-[7px] animate-drift-cloud-2" style="transform: translate(20px, -14px);">☁️</div>
                <div class="absolute text-2xl animate-float-masjid" style="transform: translateY(2px);">🕌</div>

            <span class="mt-4 text-[10px] font-mono tracking-widest text-neutral-400 uppercase font-black">MEMUAT DATABASE...</span>

        <div class="max-w-4xl w-full mx-auto px-4 sm:px-6 flex items-center justify-between">
            <a href="Admin-Dashboard.html" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-neutral-900 border border-neutral-800 hover:border-emerald-500/40 text-[10px] font-mono text-neutral-400 hover:text-emerald-400 transition-all duration-300 active:scale-95 font-bold shadow-xs">
                <span>←</span> <span>Dashboard</span>
            </a>
            <div class="flex items-center gap-3">
                <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-[10px] font-mono font-bold tracking-wider uppercase">

                <button id="themeToggleBtn" onclick="toggleTheme(event)" class="w-9 h-9 rounded-full bg-neutral-950 border border-neutral-800 flex items-center justify-center text-sm shadow-inner hover:border-emerald-500/40 active:scale-95 transition-all text-neutral-300 cursor-pointer" title="Ubah Tema">

    <!-- LOGIC SCRIPTS -->
    <script>
        // SCRIPT URL backend
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbztpGYaWJwa1jYUKFguqUgkIU4sWK0G3sS45W7uuQb176oCleXQGsDbpbuLVzG23pY/exec";

        let localAnggota = [];

        const savedTheme = localStorage.getItem('theme') === 'dark' ? 'dark' : 'light';
        applyTheme(savedTheme);

        function initKelolaAnggotaPage() {
            applyTheme(savedTheme);
            fetchInitialData();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initKelolaAnggotaPage);
        } else {
            initKelolaAnggotaPage();
        }

        // Fetch data awal
        function fetchInitialData(silent = false) {
            if (!silent) showLoadingOverlay();

            const cacheKey = "bendahara_all_data_cache";
            const cachedData = localStorage.getItem(cacheKey);
            let hasRenderedFromCache = false;

            if (cachedData) {
                try {
                    const parsed = JSON.parse(cachedData);
                    localAnggota = parsed.anggota || [];
                    renderAnggotaList();
                    hasRenderedFromCache = true;
                } catch(e) {
                    console.error("Gagal membaca cache lokal", e);
                }
            }

            if (!GOOGLE_SCRIPT_URL) {
                // Fallback dummy jika URL kosong
                if (!hasRenderedFromCache) {
                    localAnggota = [
                        { id: "M001", nim: "2490343013", name: "Muhammad Haris", divisi: "Departemen HuMed", jabatan: "Anggota", is_active: true },
                        { id: "M002", nim: "2490444040", name: "Hafiz Alfariz", divisi: "Pimpinan Utama", jabatan: "Ketua Umum", is_active: true }
                    ];
                    renderAnggotaList();
                }
                hideLoadingOverlay();
                return;
            }

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 12000);

            fetch(GOOGLE_SCRIPT_URL + "?action=get_all_data", { signal: controller.signal })
                .then(res => res.json())
                .then(res => {
                    if (res.status === "success") {
                        localAnggota = res.anggota || [];
                        localStorage.setItem(cacheKey, JSON.stringify(res));
                        renderAnggotaList();
                    }
                })
                .catch(err => {
                    console.error("Fetch Error:", err);
                    if (!hasRenderedFromCache) {
                        document.getElementById('anggotaListContainer').innerHTML = `
                            <div class="py-12 text-center text-xs text-red-500 font-mono border border-red-950/20 rounded-xl bg-red-950/5">
                                Koneksi gagal / database offline!
                            </div>`;
                    }
                })
                .finally(() => {
                    clearTimeout(timeoutId);
                    hideLoadingOverlay();
                });
        }

        // Render Anggota ke HTML
        function renderAnggotaList() {
            const container = document.getElementById('anggotaListContainer');
            if (!container) return;

            container.innerHTML = '';
            document.getElementById('memberCountBadge').innerText = `${localAnggota.length} Anggota`;

            if (localAnggota.length === 0) {
                container.innerHTML = `<div class="py-12 text-center text-xs text-neutral-500 font-mono border border-neutral-900 rounded-xl bg-neutral-950/20">Belum ada data anggota.</div>`;
                return;
            }

            localAnggota.forEach(m => {
                const badgeActive = m.is_active !== false 
                    ? `<span class="px-2 py-0.5 rounded-md text-[8px] font-bold font-sans bg-emerald-950/50 border border-emerald-900/60 text-emerald-400 uppercase tracking-wider">Aktif</span>`
                    : `<span class="px-2 py-0.5 rounded-md text-[8px] font-bold font-sans bg-red-950/50 border border-red-900/60 text-rose-400 uppercase tracking-wider">Tidak Aktif</span>`;
                
                const cardHtml = `
                    <div class="anggota-card bg-neutral-950 border border-neutral-900 p-3.5 rounded-xl flex items-center justify-between gap-3 shadow-xs transition-all duration-300 hover:border-cyan-500/20" data-name="${String(m.name || '').toLowerCase()}" data-nim="${String(m.nim || '').toLowerCase()}">
                        <div class="overflow-hidden flex flex-col gap-0.5">
                            <div class="flex items-center gap-2 flex-wrap">
                                <h3 class="text-xs font-bold text-neutral-200 truncate font-sans">${m.name}</h3>
                                ${badgeActive}
                            </div>
                            <div class="flex flex-wrap items-center gap-x-2 text-[9px] font-mono text-neutral-500 mt-0.5">
                                <span class="text-neutral-400 font-semibold select-all">${m.nim}</span>
                                <span class="text-neutral-800">|</span>
                                <span class="text-neutral-400">${m.divisi} — ${m.jabatan}</span>
                            </div>
                        </div>
                        <button type="button" onclick="bukaModalEdit('${m.id}')" class="bg-neutral-900 hover:bg-cyan-900/20 border border-neutral-800 text-cyan-400 text-[10px] font-bold px-3 py-1.5 rounded-lg font-mono transition-transform active:scale-95 cursor-pointer">
                            EDIT
                        </button>
                    </div>
                `;
                container.innerHTML += cardHtml;
            });
        }

        // Filter Anggota berdasarkan input
        function filterAnggota() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const cards = document.getElementsByClassName('anggota-card');
            for (let i = 0; i < cards.length; i++) {
                const name = cards[i].getAttribute('data-name') || '';
                const nim = cards[i].getAttribute('data-nim') || '';
                if (name.includes(query) || nim.includes(query)) {
                    cards[i].style.display = '';
                } else {
                    cards[i].style.display = 'none';
                }
            }
        }

        // Tambah Anggota Real-Time
        function tambahAnggotaRealTime(e) {
            e.preventDefault();
            const nim = document.getElementById('inp_nim').value.trim();
            const nama = document.getElementById('inp_nama').value.trim();
            const divisi = document.getElementById('inp_divisi').value;
            const jabatan = document.getElementById('inp_jabatan').value;

            if (!nim || !nama || !divisi || !jabatan) {
                Swal.fire({ icon: 'warning', title: 'Perhatian', text: 'Mohon isi semua field!' });
                return;
            }

            if (!GOOGLE_SCRIPT_URL) {
                const randomId = "MEM-" + Date.now();
                localAnggota.unshift({
                    id: randomId,
                    nim: nim,
                    name: nama,
                    divisi: divisi,
                    jabatan: jabatan,
                    is_active: true
                });
                Swal.fire({ icon: 'success', title: 'Berhasil!', text: 'Anggota tersimpan secara lokal.', showConfirmButton: false, timer: 1000 });
                document.getElementById('formTambahAnggotaAjax').reset();
                renderAnggotaList();
                return;
            }

            Swal.fire({
                title: 'Mendaftarkan Anggota...',
                text: 'Menulis data pengurus baru ke Google Sheets.',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: "insert_member",
                    nim: nim,
                    nama: nama,
                    divisi: divisi,
                    jabatan: jabatan
                })
            })
            .then(() => {
                setTimeout(() => {
                    Swal.close();
                    Swal.fire({ icon: 'success', title: 'Anggota Berhasil Ditambahkan!', showConfirmButton: false, timer: 1200 });
                    document.getElementById('formTambahAnggotaAjax').reset();
                    fetchInitialData(true);
                }, 1500);
            })
            .catch(err => {
                Swal.close();
                console.error(err);
                Swal.fire({ icon: 'error', title: 'Gagal Menambahkan!', text: err.toString() });
            });
        }

        // Buka Modal Edit Anggota
        function bukaModalEdit(id) {
            const member = localAnggota.find(m => m.id.toString() === id.toString());
            if (!member) return;

            const divisis = [
                'Departemen Kaderisasi',
                'Departemen Sosial Masyarakat',
                'Departemen Syi\'ar Islam',
                'Departemen HuMed',
                'Divisi UUS',
                'Biro Kesekretariatan',
                'Biro Bendahara',
                'Pimpinan Utama'
            ];

            const jabatans = [
                'Ketua Umum',
                'Sekretaris Umum',
                'Bendahara Umum',
                'Ketua Departemen',
                'Kepala Divisi',
                'Kepala Biro',
                'Staff Ahli',
                'Anggota'
            ];

            let divisiOptions = '';
            divisis.forEach(d => {
                const selected = member.divisi === d ? 'selected' : '';
                divisiOptions += `<option value="${d}" ${selected}>${d}</option>`;
            });

            let jabatanOptions = '';
            jabatans.forEach(j => {
                const selected = member.jabatan === j ? 'selected' : '';
                jabatanOptions += `<option value="${j}" ${selected}>${j}</option>`;
            });

            const isActiveChecked = member.is_active !== false ? 'checked' : '';

            Swal.fire({
                title: 'EDIT DETAIL ANGGOTA',
                html: `
                    <div class="text-left flex flex-col gap-3 font-sans mt-3">
                        <div>
                            <label class="text-[8px] font-mono text-neutral-500 uppercase font-black block mb-1">NIM Pengurus</label>
                            <input type="text" id="edit_nim" value="${member.nim}" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-2 text-xs text-neutral-200 focus:outline-none focus:border-cyan-500 font-mono">
                        </div>
                        <div>
                            <label class="text-[8px] font-mono text-neutral-500 uppercase font-black block mb-1">Nama Lengkap</label>
                            <input type="text" id="edit_nama" value="${member.name}" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-2 text-xs text-neutral-200 focus:outline-none focus:border-cyan-500 font-sans">
                        </div>
                        <div>
                            <label class="text-[8px] font-mono text-neutral-500 uppercase font-black block mb-1">Divisi / Biro</label>
                            <select id="edit_divisi" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-2 text-xs text-neutral-200 focus:outline-none focus:border-cyan-500 font-sans">
                                ${divisiOptions}
                            </select>
                        </div>
                        <div>
                            <label class="text-[8px] font-mono text-neutral-500 uppercase font-black block mb-1">Jabatan</label>
                            <select id="edit_jabatan" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-2 text-xs text-neutral-200 focus:outline-none focus:border-cyan-500 font-sans">
                                ${jabatanOptions}
                            </select>
                        </div>
                        <div class="flex items-center gap-2 py-1 mt-1 border-t border-neutral-900/60 pt-3">
                            <input type="checkbox" id="edit_is_active" ${isActiveChecked} class="w-4 h-4 rounded border-neutral-800 bg-neutral-950 text-cyan-500 focus:ring-cyan-500 cursor-pointer">
                            <label for="edit_is_active" class="text-xs font-bold text-neutral-200 cursor-pointer select-none">Status Anggota Aktif</label>
                        </div>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: 'SIMPAN PERUBAHAN ✓',
                cancelButtonText: 'BATAL ✕',
                focusConfirm: false,
                preConfirm: () => {
                    return {
                        nim: document.getElementById('edit_nim').value.trim(),
                        nama: document.getElementById('edit_nama').value.trim(),
                        divisi: document.getElementById('edit_divisi').value,
                        jabatan: document.getElementById('edit_jabatan').value,
                        is_active: document.getElementById('edit_is_active').checked
                    }
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    const data = result.value;
                    simpanPerubahanAnggota(id, data);
                }
            });
        }

        // Simpan Perubahan Anggota
        function simpanPerubahanAnggota(id, data) {
            if (!GOOGLE_SCRIPT_URL) {
                const idx = localAnggota.findIndex(m => m.id.toString() === id.toString());
                if (idx !== -1) {
                    localAnggota[idx].nim = data.nim;
                    localAnggota[idx].name = data.nama;
                    localAnggota[idx].divisi = data.divisi;
                    localAnggota[idx].jabatan = data.jabatan;
                    localAnggota[idx].is_active = data.is_active;
                }
                Swal.fire({ icon: 'success', title: 'Berhasil!', text: 'Perubahan disimpan secara lokal.', showConfirmButton: false, timer: 1000 });
                renderAnggotaList();
                return;
            }

            Swal.fire({
                title: 'Menyimpan Perubahan...',
                text: 'Mengirimkan pembaruan data ke Google Sheets.',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: "edit_member",
                    id: id,
                    nim: data.nim,
                    nama: data.nama,
                    divisi: data.divisi,
                    jabatan: data.jabatan,
                    is_active: data.is_active
                })
            })
            .then(() => {
                setTimeout(() => {
                    Swal.close();
                    Swal.fire({ icon: 'success', title: 'Pembaruan Berhasil!', showConfirmButton: false, timer: 1200 });
                    fetchInitialData(true);
                }, 1500);
            })
            .catch(err => {
                Swal.close();
                console.error(err);
                Swal.fire({ icon: 'error', title: 'Gagal Menyimpan!', text: err.toString() });
            });
        }

        // Overlay Utilities
        function showLoadingOverlay() {
            const overlay = document.getElementById('loading-overlay');
            if (overlay) {
                overlay.style.opacity = '1';
                overlay.style.pointerEvents = 'auto';
            }
        }
        function hideLoadingOverlay() {
            const overlay = document.getElementById('loading-overlay');
            if (overlay) {
                overlay.style.opacity = '0';
                overlay.style.pointerEvents = 'none';
            }
        }

        // Premium Theme Switcher
        function applyTheme(theme) {
            const btn = document.getElementById('themeToggleBtn');
            const isLight = (theme === 'light');
            if (isLight) {
                document.documentElement.classList.add('light-mode');
                document.documentElement.classList.remove('dark');
                document.body.classList.add('light-mode');
                document.body.classList.remove('dark');
                if (btn) btn.innerText = '☀️';
            } else {
                document.documentElement.classList.remove('light-mode');
                document.documentElement.classList.add('dark');
                document.body.classList.remove('light-mode');
                document.body.classList.add('dark');
                if (btn) btn.innerText = '🌙';
            }
        }

        function toggleTheme(e) {
            const event = e || window.event;
            const currentTheme = localStorage.getItem('theme') === 'dark' ? 'dark' : 'light';
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            localStorage.setItem('theme', newTheme);
            triggerThemeAnimation(newTheme, event);
        }

        function triggerThemeAnimation(newTheme, event) {
            const ripple = document.createElement('div');
            ripple.style.position = 'fixed';
            ripple.style.zIndex = '9998';
            ripple.style.borderRadius = '50%';
            ripple.style.pointerEvents = 'none';
            ripple.style.transition = 'transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease-out';
            ripple.style.backgroundColor = newTheme === 'light' ? '#FAF5EF' : '#080C14';
            
            let posX = window.innerWidth / 2;
            let posY = window.innerHeight / 2;
            
            if (event && event.clientX) {
                posX = event.clientX;
                posY = event.clientY;
            } else {
                const btn = document.getElementById('themeToggleBtn');
                if (btn) {
                    const rect = btn.getBoundingClientRect();
                    posX = rect.left + rect.width / 2;
                    posY = rect.top + rect.height / 2;
                }
            }
            
            const radius = Math.max(
                Math.hypot(posX, posY),
                Math.hypot(window.innerWidth - posX, posY),
                Math.hypot(window.innerWidth - posX, window.innerHeight - posY),
                Math.hypot(posX, window.innerHeight - posY)
            );
            
            ripple.style.width = '2px';
            ripple.style.height = '2px';
            ripple.style.left = `${posX - 1}px`;
            ripple.style.top = `${posY - 1}px`;
            ripple.style.transform = 'scale(0)';
            
            document.body.appendChild(ripple);
            
            ripple.offsetHeight; // Force reflow
            
            ripple.style.transform = `scale(${radius})`;
            
            setTimeout(() => {
                applyTheme(newTheme);
                ripple.style.opacity = '0';
                setTimeout(() => {
                    ripple.remove();
                }, 400);
            }, 350);
        }
    </script>
