        /* DYNAMIC COSMIC NEBULA BACKGROUND */
        body::before {
            content: "";
            position: fixed;
            top: -120px;
            left: -120px;
            width: calc(100% + 240px);

            background:

            pointer-events: none;
            z-index: -2;
            animation: pulseGlow 18s ease-in-out infinite alternate;

        html.light-mode body::before {

<body class="min-h-screen antialiased flex flex-col justify-center items-center px-6 relative selection:bg-emerald-950 selection:text-emerald-400">

    <script>
        // Kredensial disimpan sebagai hash SHA-256 untuk keamanan
        // (Bukan plaintext - tidak bisa dibaca langsung dari source code)

        const savedTheme = localStorage.getItem('theme') === 'dark' ? 'dark' : 'light';
        applyTheme(savedTheme);

        document.addEventListener('DOMContentLoaded', () => {
            applyTheme(savedTheme);
        });

        // --- Theme System Scripts ---
        function applyTheme(theme) {
            const btn = document.getElementById('themeToggleBtn');
            const isLight = (theme === 'light');
            if (isLight) {
                document.documentElement.classList.add('light-mode');
                document.documentElement.classList.remove('dark');
                document.body.classList.add('light-mode');
                document.body.classList.remove('dark');
                if (btn) btn.innerText = '☀️';
            } else {
                document.documentElement.classList.remove('light-mode');
                document.documentElement.classList.add('dark');
                document.body.classList.remove('light-mode');
                document.body.classList.add('dark');
                if (btn) btn.innerText = '🌙';
            }
        }

        function toggleTheme(e) {
            const event = e || window.event;
            const currentTheme = localStorage.getItem('theme') === 'dark' ? 'dark' : 'light';
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            localStorage.setItem('theme', newTheme);
            triggerThemeAnimation(newTheme, event);
        }

        function triggerThemeAnimation(newTheme, event) {
            const ripple = document.createElement('div');
            ripple.style.position = 'fixed';
            ripple.style.zIndex = '9998';
            ripple.style.borderRadius = '50%';
            ripple.style.pointerEvents = 'none';
            ripple.style.transition = 'transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease-out';
            ripple.style.backgroundColor = newTheme === 'light' ? '#FAF5EF' : '#080C14';
            
            let posX = window.innerWidth / 2;
            let posY = window.innerHeight / 2;
            
            if (event && event.clientX) {
                posX = event.clientX;
                posY = event.clientY;
            } else {
                const btn = document.getElementById('themeToggleBtn');
                if (btn) {
                    const rect = btn.getBoundingClientRect();
                    posX = rect.left + rect.width / 2;
                    posY = rect.top + rect.height / 2;
                }
            }
            
            ripple.style.width = '10px';
            ripple.style.height = '10px';
            ripple.style.left = `${posX - 5}px`;
            ripple.style.top = `${posY - 5}px`;
            ripple.style.transform = 'scale(0)';
            ripple.style.opacity = '1';
            
            const overlay = document.createElement('div');
            overlay.style.position = 'fixed';
            overlay.style.inset = '0';
            overlay.style.zIndex = '9999';
            overlay.style.display = 'flex';
            overlay.style.alignItems = 'center';
            overlay.style.justifyContent = 'center';
            overlay.style.pointerEvents = 'none';
            overlay.style.transition = 'opacity 0.4s ease-out';
            overlay.style.opacity = '0';
            
            const icon = document.createElement('div');
            icon.style.fontSize = '6rem';
            icon.style.transition = 'transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1)';
            icon.style.transform = 'scale(0) rotate(-45deg)';
            icon.style.filter = newTheme === 'light' ? 'drop-shadow(0 0 20px rgba(21, 128, 61, 0.4))' : 'drop-shadow(0 0 20px rgba(16, 185, 129, 0.4))';
            icon.innerText = newTheme === 'light' ? '☀️' : '🌙';
            
            overlay.appendChild(icon);
            document.body.appendChild(ripple);
            document.body.appendChild(overlay);
            
            ripple.offsetWidth;
            overlay.offsetWidth;
            
            const limit = Math.max(
                Math.hypot(posX, posY),
                Math.hypot(window.innerWidth - posX, posY),
                Math.hypot(posX, window.innerHeight - posY),
                Math.hypot(window.innerWidth - posX, window.innerHeight - posY)
            );
            const scaleFactor = (limit * 2) / 10;
            
            ripple.style.transform = `scale(${scaleFactor})`;
            overlay.style.opacity = '1';
            icon.style.transform = 'scale(1.5) rotate(0deg)';
            
            setTimeout(() => {
                applyTheme(newTheme);
            }, 380);
            
            setTimeout(() => {
                ripple.style.opacity = '0';
                overlay.style.opacity = '0';
                icon.style.transform = 'scale(0.8) rotate(45deg)';
                setTimeout(() => {
                    ripple.remove();
                    overlay.remove();
                }, 400);
            }, 650);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            applyTheme(savedTheme);
        });

        // --- Form Login Handler with SweetAlert2 ---
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const userInp = document.getElementById('username').value.trim();
            const passInp = document.getElementById('password').value;
            const errorBanner = document.getElementById('error-banner');

            // Hash password menggunakan Web Crypto API (SHA-256)
            // Plaintext password tidak disimpan, hanya hash-nya
            async function sha256(message) {
                const msgBuffer = new TextEncoder().encode(message);
                const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            }

            // Hash dari kredensial yang valid (SHA-256)
            const VALID_USER_HASH = '18d810a30910a643a50bb4bf08b3d2ca426db46a5b871fba2580547491dbe29f';
            const VALID_PASS_HASH = '933e8ddfb4016e700828918be957feeded4c7e58c40cbb4ffb55d8b9c889df49';

            const [userHash, passHash] = await Promise.all([
                sha256(userInp),
                sha256(passInp)
            ]);

            // Verifikasi kredensial menggunakan perbandingan hash
            if (userHash === VALID_USER_HASH && passHash === VALID_PASS_HASH) {
                errorBanner.classList.add('hidden');
                
                // Efek button loading sukses sebentar sebelum redirect
                const btn = e.target.querySelector('button[type="submit"]');
                btn.disabled = true;
                btn.innerText = 'AKSES DISETUJUI...';
                
                setTimeout(() => {
                    Swal.fire({
                        icon: 'success',
                        title: 'Login Berhasil!',
                        text: 'Mengalihkan ke sistem admin dashboard LDK IMIP.',
                        showConfirmButton: false,
                        timer: 1500,
                        timerProgressBar: true
                    }).then(() => {
                        sessionStorage.setItem('adminSession', 'active');
                        window.location.href = 'Admin-Dashboard.html';
                    });
                }, 600);
            } else {
                // Tampilkan pesan error jika salah ketik kredensial
                errorBanner.classList.remove('hidden');
                document.getElementById('password').value = '';
            }
        });
    </script>
</body>
</html>
